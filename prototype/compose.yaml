services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lumio
      POSTGRES_USER: lumio
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ["lumio_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumio -d lumio"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [private]
  migrate:
    build: .
    image: lumio:local
    command: ["node", "scripts/migrate.mjs"]
    environment: &app_environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: lumio
      POSTGRES_USER: lumio
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PROVISION_APP_ROLE: "true"
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS origin}
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_key
      ALLOW_SCRIPTED_AI: ${ALLOW_SCRIPTED_AI:-false}
      GUEST_SESSIONS_PER_HOUR: ${GUEST_SESSIONS_PER_HOUR:-120}
      AUTH_REQUESTS_PER_15_MINUTES: ${AUTH_REQUESTS_PER_15_MINUTES:-60}
      AI_DAILY_USER_LIMIT: ${AI_DAILY_USER_LIMIT:-40}
      AI_DAILY_GLOBAL_LIMIT: ${AI_DAILY_GLOBAL_LIMIT:-1000}
      AI_GLOBAL_CONCURRENCY: ${AI_GLOBAL_CONCURRENCY:-8}
      AI_GENERATION_AUTHOR_TIMEOUT_MS: ${AI_GENERATION_AUTHOR_TIMEOUT_MS:-45000}
      AI_GENERATION_REVIEW_TIMEOUT_MS: ${AI_GENERATION_REVIEW_TIMEOUT_MS:-90000}
      AI_GENERATION_REPAIR_ATTEMPTS: ${AI_GENERATION_REPAIR_ATTEMPTS:-1}
      AI_GENERATION_REVIEW_STREAMING: ${AI_GENERATION_REVIEW_STREAMING:-true}
    secrets: [db_password, app_db_password, deepseek_key]
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
  app:
    build: .
    image: lumio:local
    environment:
      <<: *app_environment
      POSTGRES_USER: lumio_app
      POSTGRES_PASSWORD_FILE: /run/secrets/app_db_password
      PROVISION_APP_ROLE: "false"
    secrets: [app_db_password, deepseek_key]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    networks: [private]
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your hostname}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]
networks:
  private:
volumes:
  lumio_data:
  caddy_data:
  caddy_config:
secrets:
  db_password:
    file: ../.internal/secrets/db_password
  app_db_password:
    file: ../.internal/secrets/app_db_password
  deepseek_key:
    file: ../.internal/secrets/deepseek_key
