services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lumio
      POSTGRES_USER: lumio
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["lumio_dev_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumio -d lumio"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
secrets:
  db_password:
    file: ../.internal/secrets/db_password
volumes:
  lumio_dev_data:
